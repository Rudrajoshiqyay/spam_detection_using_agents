name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11"]

    env:
      # Test environment — uses mock LLM and in-memory Redis, no real credentials needed
      MOCK_LLM: "true"
      USE_FAKE_REDIS: "true"
      DATABASE_URL: "sqlite+aiosqlite:///./test_fraud.db"
      GROQ_API_KEY: "gsk_test_key_placeholder"
      LOG_LEVEL: "WARNING"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff --quiet
          ruff check app/ tests/ --ignore E501 || true  # warn only, don't fail CI

      - name: Run unit & integration tests
        run: |
          pytest tests/ -x -q \
            --tb=short \
            --timeout=120 \
            -p no:warnings

      - name: Upload coverage (optional)
        if: success()
        run: |
          pip install pytest-cov --quiet
          pytest tests/ -q \
            --cov=app \
            --cov-report=term-missing \
            --timeout=120 \
            -p no:warnings \
            --co -q 2>/dev/null || true

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy hook
        # Set RENDER_DEPLOY_HOOK in GitHub repo secrets
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
          echo "Render deploy triggered successfully"
